[project]
name = "news-tls-agent"
version = "0.1.0"
description = "뉴스 타임라인 요약 에이전트"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pyodbc>=5.2",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.3",
    "import-linter>=2.3",
]

# 이 디렉토리가 소스 루트다. core · app · infra · api · mcp_server 가 최상위 패키지가 된다.
# backend 자체는 패키지가 아니므로 import는 `from core.ports import ...` 형태다 (AGENTS.md §2·§3).

# ─────────────────────────────────────────────────────────────
# ruff — docs/engineering/code-conventions.md의 기계 검사판
# ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle · pyflakes
    "I",             # import 정렬
    "N",             # snake_case · PascalCase
    "UP",            # 구버전 문법 갱신
    "B",             # 흔한 버그 패턴
    "ANN",           # 타입 힌트 필수
    "FA",            # from __future__ import annotations 필수
    "G", "LOG",      # 지연 포맷 로깅 (f-string 로깅 금지)
    "BLE", "TRY",    # 예외를 삼키지 않는다
    "S",             # API 키·접속정보 하드코딩
    "TID",           # 상대 import 금지
    "RUF",
]
ignore = [
    "E501",    # 줄 길이는 formatter가 처리
    "ANN401",  # **kwargs: Any 허용
    "TRY003",  # 예외 메시지를 호출부에 쓰는 것 허용
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]        # 테스트는 힌트·assert 강제 안 함
"api/**" = ["B008"]                 # FastAPI Depends() 기본값 관용
"**/__init__.py" = ["F401", "I002"] # 재수출 허용 · 빈 패키지 파일 예외
"scripts/[0-9][0-9]_*.py" = ["N999"] # 실행 순서를 나타내는 파일명

[tool.ruff.lint.isort]
known-first-party = ["core", "app", "infra", "api", "mcp_server", "scripts", "tests"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ─────────────────────────────────────────────────────────────
# import-linter — AGENTS.md §1·§3의 기계 검사판
# 위반하면 `lint-imports`가 실패한다. 문서가 아니라 게이트다.
# ─────────────────────────────────────────────────────────────
[tool.importlinter]
root_packages = ["core", "app", "infra", "api", "mcp_server"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AGENTS §3 계층 방향: api·mcp_server → app → core"
type = "layers"
layers = [
    "api : mcp_server",
    "app",
    "core",
]

[[tool.importlinter.contracts]]
name = "AGENTS §3 core는 I/O·저장소·웹·에이전트 프레임워크를 모른다(Pydantic 허용)"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "langgraph",
    "sqlalchemy",
    "qdrant_client",
    "google",
]

[[tool.importlinter.contracts]]
name = "AGENTS §3 app은 웹 프레임워크를 모른다"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "AGENTS §3 infra import는 조립 지점에서만 (deps.py · server.py · scripts · integration)"
type = "forbidden"
source_modules = ["core", "app", "api.routes", "mcp_server.tools"]
forbidden_modules = ["infra"]

[[tool.importlinter.contracts]]
name = "AGENTS §3 infra는 app·api를 참조하지 않는다"
type = "forbidden"
source_modules = ["infra"]
forbidden_modules = ["app", "api", "mcp_server"]

# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: 저장소·컨테이너가 필요한 테스트"]
