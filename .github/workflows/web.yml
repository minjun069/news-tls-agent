name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        run: make web-install

      - name: 타입 검사와 빌드
        run: make web-check
