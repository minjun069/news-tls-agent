name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성 설치
        run: make install

      - name: 전체 검사
        run: make check

  # MS-SQL·Qdrant 서비스 통합 테스트는 S9에서 추가한다.
  # docs/engineering/agent-workflow.md L3 참조.
