# 실행 모드는 docs/architecture/overview.md §4 참조.
#
#   docker compose up -d                  모드 A — qdrant만 (개발)
#   docker compose --profile full up -d   모드 B — 전부 (클린 클론 검증·데모, NFR-13)
#
# 모드 A에서 MS-SQL은 네이티브 설치를 쓴다 (ADR-0002). 여기 mssql은
# 모드 B 전용이며, CI의 서비스 컨테이너는 workflow가 별도로 정의한다.

x-backend-environment: &backend-environment
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
  GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-3072}
  LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nlpai-lab/KURE-v1}
  LOCAL_EMBEDDING_DIMENSIONS: ${LOCAL_EMBEDDING_DIMENSIONS:-1024}
  LOCAL_EMBEDDING_NORMALIZE: ${LOCAL_EMBEDDING_NORMALIZE:-true}
  LOCAL_EMBEDDING_MAX_SEQ_LENGTH: ${LOCAL_EMBEDDING_MAX_SEQ_LENGTH:-256}
  LOCAL_EMBEDDING_BATCH_SIZE: ${LOCAL_EMBEDDING_BATCH_SIZE:-4}
  LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-cpu}
  LOCAL_EMBEDDING_THREADS: ${LOCAL_EMBEDDING_THREADS:-10}
  LOCAL_EMBEDDING_QUERY_PROMPT: ${LOCAL_EMBEDDING_QUERY_PROMPT:-}
  HF_HOME: /app/models
  TIMELINE_MAX_ROUNDS: ${TIMELINE_MAX_ROUNDS:-4}
  TIMELINE_MAX_CHAIN_DEPTH: ${TIMELINE_MAX_CHAIN_DEPTH:-2}
  TIMELINE_MAX_CLARIFICATIONS: ${TIMELINE_MAX_CLARIFICATIONS:-2}
  TIMELINE_SEARCH_TOP_K: ${TIMELINE_SEARCH_TOP_K:-20}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  MSSQL_HOST: mssql
  MSSQL_PORT: "1433"
  MSSQL_DB: ${MSSQL_DB:-newsagent}
  MSSQL_USER: sa
  MSSQL_PASSWORD: ${MSSQL_PASSWORD:-}
  MSSQL_DRIVER: ODBC Driver 18 for SQL Server
  MSSQL_TRUST_CERT: "yes"
  MSSQL_COLLATION: ${MSSQL_COLLATION:-Korean_Wansung_CI_AS}
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-articles_kure_v1}
  API_LOG: /app/logs/api.log
  MCP_AUDIT_LOG: /app/logs/mcp-audit.log
  EXPORT_DOWNLOAD_DIR: /app/downloads
  PDF_FONT_PATH: ${PDF_FONT_PATH:-/usr/share/fonts/truetype/nanum/NanumGothic.ttf}
  NOTION_TOKEN: ${NOTION_TOKEN:-}
  NOTION_PARENT_PAGE_ID: ${NOTION_PARENT_PAGE_ID:-}

services:
  # ── 항상 뜬다 ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: newsagent-qdrant
    ports:
      - "6333:6333" # REST · 대시보드 http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # ── profile: full ──────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: newsagent-mssql
    profiles: ["full"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # `${VAR:?}`는 프로필과 무관하게 해석되어 모드 A(qdrant만)까지 막는다.
      # 비어 있으면 컨테이너가 SQL Server 자체 오류로 즉시 종료하므로 그걸로 충분하다.
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-}
      # 네이티브 설치와 collation을 맞춘다 (docs/architecture/overview.md §4.2).
      # 다르면 한글 정렬·NVARCHAR 비교·LIKE가 달라져 로컬만 통과하는 상황이 생긴다.
      MSSQL_COLLATION: ${MSSQL_COLLATION:-Korean_Wansung_CI_AS}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  migrate:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment: *backend-environment
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - downloads-data:/app/downloads
      - logs-data:/app/logs
      - embedding-models:/app/models
    restart: unless-stopped

  # stdio 서버 이미지를 독립 실행·Inspector 연결용으로 함께 기동한다. API는 같은 이미지의
  # 모듈을 자식 프로세스로 실행해 stdio 경계를 유지한다 (ADR-0007).
  mcp:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: mcp
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    stdin_open: true
    volumes:
      - downloads-data:/app/downloads
      - logs-data:/app/logs
      - embedding-models:/app/models
    restart: unless-stopped

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  qdrant-data:
  mssql-data:
  downloads-data:
  logs-data:
  embedding-models:
