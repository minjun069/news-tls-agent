# 실행 모드는 docs/architecture/overview.md §4 참조.
#
#   docker compose up -d                  모드 A — qdrant만 (개발)
#   docker compose --profile full up -d   모드 B — 전부 (클린 클론 검증·데모, NFR-13)
#
# 모드 A에서 MS-SQL은 네이티브 설치를 쓴다 (ADR-0002). 여기 mssql은
# 모드 B·C 전용이며, 배포 형태에 대한 결정을 바꾸지 않는다.

services:
  # ── 항상 뜬다 ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest # TODO: NFR-13(재현성)을 위해 버전 고정
    container_name: newsagent-qdrant
    ports:
      - "6333:6333" # REST · 대시보드 http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # ── profile: full ──────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: newsagent-mssql
    profiles: ["full"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # `${VAR:?}`는 프로필과 무관하게 해석되어 모드 A(qdrant만)까지 막는다.
      # 비어 있으면 컨테이너가 SQL Server 자체 오류로 즉시 종료하므로 그걸로 충분하다.
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-}
      # 네이티브 설치와 collation을 맞춘다 (docs/architecture/overview.md §4.2).
      # 다르면 한글 정렬·NVARCHAR 비교·LIKE가 달라져 로컬만 통과하는 상황이 생긴다.
      MSSQL_COLLATION: ${MSSQL_COLLATION:-Korean_Wansung_CI_AS}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # api · mcp · web은 각각 S6 · S4 · S7에서 추가한다.
  # docs/engineering/roadmap.md 참조. Dockerfile이 생기기 전에는 정의하지 않는다.

volumes:
  qdrant-data:
  mssql-data:
